# Деплой на VPS: сборка образа в CI (не на сервере), пуш в GHCR, на сервере — только pull и up.
# Секреты: VPS_HOST, VPS_USER, VPS_SSH_KEY; для сборки: PUBLIC_CONTACT_WEBHOOK, SITE (опционально).
name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || (sleep 10 && npm ci)

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            --build-arg PUBLIC_CONTACT_WEBHOOK="${{ secrets.PUBLIC_CONTACT_WEBHOOK }}" \
            --build-arg SITE="${{ secrets.SITE }}" \
            -t ${IMAGE}:${{ github.sha }} \
            -t ${IMAGE}:latest \
            -f docker/Dockerfile .
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd /opt
            git fetch origin
            git reset --hard origin/main
            bash deploy/deploy.sh

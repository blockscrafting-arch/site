server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block dotfiles (.env, .git, .aws, .ssh, etc.)
    location ~ /\. {
        return 404;
    }

    # Block common attack paths
    location ~* ^/(wp-admin|wp-login|wp-content|wordpress|phpinfo|phpmyadmin|admin/config|pms|cgi-bin) {
        return 404;
    }

    # Block server-side script extensions
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    # Static assets with long cache
    location ~* \.(js|css|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main location - serve static files, 404 for missing
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Custom 404 page
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

      ответы по FAQ, передача диалога менеджеру, рассылки и проверка подписок.
      Делаю боты для Telegram, MAX и VK. В том же чате — админ-панель:
      модерация, настройки, отчёты и запуск скриптов без отдельных сервисов.
    platforms: [Telegram, MAX, VK]
    features:
      - Приём заявок, запись на приём, ответы по FAQ
      - Передача диалога менеджеру по кнопке
      - Рассылки по базе и проверка подписок
      - Публикация постов в каналы и группы
      - Админ-панель прямо в чате: настройки, отчёты
      - Поддержка Telegram, MAX и VK
    related_cases:

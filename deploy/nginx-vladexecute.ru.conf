# Конфиг nginx на хосте: прокси на контейнер (порт 9080).
# Разместить: /etc/nginx/sites-available/vladexecute.ru
# Симлинк: ln -s /etc/nginx/sites-available/vladexecute.ru /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name vladexecute.ru www.vladexecute.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vladexecute.ru www.vladexecute.ru;

    ssl_certificate /etc/letsencrypt/live/vladexecute.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vladexecute.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
